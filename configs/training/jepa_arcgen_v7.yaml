# JEPA ARC-GEN V7 - Real ARC Task Transformations
#
# MAJOR CHANGE: Train on ARC-GEN-100K dataset
#
# Why this should work better:
#   - ARC-GEN contains 100K examples from 400 REAL ARC tasks
#   - Transformations are genuinely diverse (symmetry, counting, object manipulation, etc.)
#   - Much harder than our synthetic curriculum (which was too easy)
#   - Input→Output prediction on real ARC = actual learning signal
#
# Data source: https://www.kaggle.com/datasets/arcgen100k/the-arc-gen-100k-dataset
# Paper: Moffitt, M.D. (2025). arXiv:2511.00162
#
# Expected outcome:
#   - L2 loss should NOT collapse to 0 (task is genuinely hard)
#   - Gradient norms should stay healthy
#   - May need to train longer (real patterns are complex)

seed: 795
dataset_manifest: data/arc_gen_100k/manifest.jsonl

data:
  context_window: 1                # Single input grid
  target_offset: 1                 # Predict output from input
  shuffle: true
  validation:
    split: 0.05                    # 5% validation (5K examples)
    seed: 42

tokenizer:
  max_objects: 16
  max_color_features: 10
  background: 0
  connectivity: 4
  normalize: true
  respect_colors: true

object_encoder:
  hidden_dim: 768
  num_embeddings: 2048
  commitment_cost: 0.15
  ema_decay: 0.95
  vq_enabled: true
  vq_refresh_enabled: false
  vq_refresh_interval: 3000
  vq_refresh_usage_threshold: 0.01
  activation: "gelu"
  relational: true
  relational_layers: 6
  relational_heads: 12
  relational_dropout: 0.1

model:
  type: "conv"
  embedding_dim: 1024
  projection_dim: 256              # Same as V6
  projection_layers: 2

optimizer:
  name: "adam"
  lr: 3.0e-5
  weight_decay: 1.0e-6

training:
  batch_size: 256                  # Smaller dataset, smaller batch
  grad_accum_steps: 4              # Effective batch = 1024
  num_workers: 8
  epochs: 200                      # More epochs (fewer samples)
  checkpoint_dir: artifacts/jepa/arcgen_v7
  checkpoint_interval: 20
  device: cuda
  drop_last: true
  mixed_precision: "bf16"
  pin_memory: true
  grad_clip:
    max_norm: 0.5
    norm_type: 2.0
  lr_scheduler:
    name: "cosine"
    warmup_steps: 1000             # Fewer warmup steps (smaller dataset)
    min_lr_scale: 0.1
    total_steps: 20000             # ~100K samples / 256 batch * 50 epochs
  early_stopping:
    enabled: true                  # Enable early stopping
    patience: 30                   # Stop if no improvement for 30 epochs
    min_delta: 0.0001
    mode: min

# Light augmentations - the task is already hard
context_augmentations:
  mask_ratio: 0.15                 # Light masking (task is already hard)
  object_dropout: 0.1              # Light object dropout
  random_crop_radius: 0
  palette_permutation: false       # Keep colors for ARC semantics
  gaussian_noise_std: 0.0
  min_grid_size_for_crop: 8
  geometric_augmentation: false    # Don't transform - ARC is position-sensitive

augmentations:
  mask_ratio: 0.0
  object_dropout: 0.0
  random_crop_radius: 0
  palette_permutation: false
  gaussian_noise_std: 0.0
  geometric_augmentation: false

loss:
  objective: "sigreg"
  temperature: 0.07
  temperature_min: 0.05
  temperature_max: 0.20
  learnable_temperature: false
  queue_size: 4096                 # Smaller queue (fewer unique tasks)
  projection_dim: 256
  projection_layers: 2
  projection_activation: "relu"
  use_target_encoder: false
  target_ema_decay: 0.99

sigreg:
  weight: 0.05
  num_slices: 1024
  num_points: 17

logging:
  enabled: true
  log_dir: artifacts/jepa/arcgen_v7/tensorboard
  flush_secs: 10
  run_name: jepa_arcgen_v7

diagnostics:
  embedding_metrics:
    enabled: true
    interval: 50                   # More frequent logging
    max_samples: 4096
