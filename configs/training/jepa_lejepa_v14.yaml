# JEPA V14 - L-JEPA with Paper-Aligned Hyperparameters
#
# CHANGES FROM V13:
#   1. λ = 0.10 (within paper's recommended [0.01, 0.1] range, was 0.15)
#   2. Added predictor network (2 layers, 512 hidden dim) per L-JEPA paper Section 3
#   3. Extended training to 400 epochs (loss was still decreasing at 200)
#
# V13 RESULTS (for reference):
#   - Completed 200 epochs successfully (no early stopping!)
#   - Effective rank: ~200 (excellent dimensional utilization)
#   - VQ usage: 34% (up from 2% in v11)
#   - Max gradient norm: ~0.58 (stable, bounded as per Theorem 4)
#   - Final loss: 0.131
#   - SIGReg raw: 0.84 (still room to improve toward 0)
#
# PREDICTOR NETWORK:
#   The L-JEPA paper uses a predictor to transform context embeddings before
#   comparing with target. This allows asymmetric learning where the predictor
#   learns the mapping while the encoder learns good representations.
#
#   Architecture: context_proj -> MLP(2 layers, 512 hidden) -> predicted_target
#   Loss: MSE(predicted_target, target_proj)
#
# Reference: "Provable and Scalable Self-Supervised Learning Without the Heuristics"
#            Balestriero et al., arXiv 2511.08544 (2025)

seed: 802
dataset_manifest: data/arc_gen_100k/manifest.jsonl

data:
  context_window: 1
  target_offset: 1
  shuffle: true
  validation:
    split: 0.05
    seed: 42

tokenizer:
  max_objects: 16
  max_color_features: 10
  background: 0
  connectivity: 4
  normalize: true
  respect_colors: true

object_encoder:
  hidden_dim: 768
  num_embeddings: 2048
  commitment_cost: 0.15
  ema_decay: 0.95
  vq_enabled: true
  vq_refresh_enabled: false
  activation: "gelu"
  relational: true
  relational_layers: 6
  relational_heads: 12
  relational_dropout: 0.1

model:
  type: "conv"
  embedding_dim: 1024
  projection_dim: 256
  projection_layers: 2

optimizer:
  name: "adam"
  lr: 1.0e-4
  weight_decay: 1.0e-6

training:
  batch_size: 256
  grad_accum_steps: 4
  num_workers: 8
  epochs: 400              # INCREASED from 200 - loss was still decreasing
  checkpoint_dir: artifacts/jepa/lejepa_v14
  checkpoint_interval: 20
  device: cuda
  drop_last: true
  mixed_precision: "bf16"
  pin_memory: true
  grad_clip:
    max_norm: 1.0
    norm_type: 2.0
  lr_scheduler:
    name: "cosine"
    warmup_steps: 1000
    min_lr_scale: 0.1
    total_steps: 40000     # INCREASED to match 400 epochs
  early_stopping:
    enabled: true
    patience: 60           # INCREASED patience for longer training
    min_delta: 0.0001
    mode: min

# Moderate masking for context
context_augmentations:
  mask_ratio: 0.4
  object_dropout: 0.4
  random_crop_radius: 0
  palette_permutation: false
  gaussian_noise_std: 0.0
  geometric_augmentation: false

# Target gets NO masking
augmentations:
  mask_ratio: 0.0
  object_dropout: 0.0
  random_crop_radius: 0
  palette_permutation: false
  gaussian_noise_std: 0.0
  geometric_augmentation: false

loss:
  # L-JEPA objective: Direct L2 prediction + SIGReg regularization
  objective: "sigreg"

  # These are not used in sigreg mode but kept for config compatibility
  temperature: 0.07
  temperature_min: 0.05
  temperature_max: 0.20
  learnable_temperature: false
  queue_size: 4096
  projection_dim: 256
  projection_layers: 2
  projection_activation: "relu"

  # No target encoder needed with SIGReg
  use_target_encoder: false
  target_ema_decay: 0.996

  # PREDICTOR NETWORK - NEW in V14
  # Per L-JEPA paper: predictor transforms context to predict target
  # This allows asymmetric learning (predictor learns mapping, encoder learns representations)
  predictor_depth: 2       # 2-layer MLP predictor
  predictor_hidden_dim: 512  # Hidden dimension for predictor

# SIGReg - λ within paper's recommended range
# Paper recommends λ ∈ [0.01, 0.1] for vision tasks
# V13 used 0.15 (slightly above), V14 uses 0.10 (at upper bound)
sigreg:
  weight: 0.10         # DECREASED from 0.15 to within paper's range
  num_slices: 1024     # Number of random projections (paper uses 1024)
  num_points: 17       # Integration points for Epps-Pulley (paper uses 17)

# VICReg DISABLED
vicreg:
  enabled: false
  variance_weight: 0.0
  covariance_weight: 0.0
  variance_target: 1.0
  regularize_target: false

logging:
  enabled: true
  log_dir: artifacts/jepa/lejepa_v14/tensorboard
  flush_secs: 10
  run_name: jepa_lejepa_v14

diagnostics:
  embedding_metrics:
    enabled: true
    interval: 50
    max_samples: 4096
