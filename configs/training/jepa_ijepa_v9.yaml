# JEPA V9 - I-JEPA with Stability Fixes
#
# KEY CHANGES from V8:
#   V8 showed learning (loss 0.68 -> 0.09) but then EXPLODED (0.09 -> 346)
#   This is training instability, NOT collapse. Fixes:
#
#   1. Lower LR: 1e-4 -> 3e-5 (reduce step size)
#   2. Slower EMA: 0.996 -> 0.9995 (target drifts more slowly)
#   3. Add SIGReg back: weight=0.01 (mild regularization on embedding scale)
#   4. Tighter grad clip: 1.0 -> 0.5 (more aggressive clipping)
#   5. More warmup: 1000 -> 2000 steps (gentler start)
#   6. Reduce masking: 0.5 -> 0.3 (easier prediction = more stable)
#
# Diagnosis from V8:
#   - Loss hit minimum 0.09 at epoch 5
#   - Then grew exponentially: 0.09 -> 0.15 -> 0.25 -> 0.46 -> 0.95 -> 1.85 -> ...
#   - Grad norms also exploded: 0.17 -> 2.5 -> 10.4 (pre-clip)
#   - EMA target was drifting faster than predictor could track

seed: 797
dataset_manifest: data/arc_gen_100k/manifest.jsonl

data:
  context_window: 1
  target_offset: 1
  shuffle: true
  validation:
    split: 0.05
    seed: 42

tokenizer:
  max_objects: 16
  max_color_features: 10
  background: 0
  connectivity: 4
  normalize: true
  respect_colors: true

object_encoder:
  hidden_dim: 768
  num_embeddings: 2048
  commitment_cost: 0.15
  ema_decay: 0.95
  vq_enabled: true
  vq_refresh_enabled: false
  activation: "gelu"
  relational: true
  relational_layers: 6
  relational_heads: 12
  relational_dropout: 0.1

model:
  type: "conv"
  embedding_dim: 1024
  projection_dim: 256
  projection_layers: 2

optimizer:
  name: "adam"
  lr: 3.0e-5                         # REDUCED from 1e-4 for stability
  weight_decay: 1.0e-5               # Slightly higher weight decay

training:
  batch_size: 256
  grad_accum_steps: 4
  num_workers: 8
  epochs: 200
  checkpoint_dir: artifacts/jepa/ijepa_v9
  checkpoint_interval: 20
  device: cuda
  drop_last: true
  mixed_precision: "bf16"
  pin_memory: true
  grad_clip:
    max_norm: 0.5                    # REDUCED from 1.0 - tighter clipping
    norm_type: 2.0
  lr_scheduler:
    name: "cosine"
    warmup_steps: 2000               # INCREASED from 1000 - gentler start
    min_lr_scale: 0.1
    total_steps: 20000
  early_stopping:
    enabled: true
    patience: 50                     # More patience with lower LR
    min_delta: 0.0001
    mode: min

# REDUCED masking - V8's 50% was too aggressive
# Start with easier prediction, can increase later
context_augmentations:
  mask_ratio: 0.3                    # REDUCED from 0.5
  object_dropout: 0.3                # REDUCED from 0.5
  random_crop_radius: 0
  palette_permutation: false
  gaussian_noise_std: 0.0
  geometric_augmentation: false

# Target still gets NO masking
augmentations:
  mask_ratio: 0.0
  object_dropout: 0.0
  random_crop_radius: 0
  palette_permutation: false
  gaussian_noise_std: 0.0
  geometric_augmentation: false

loss:
  objective: "ijepa"
  temperature: 0.07
  temperature_min: 0.05
  temperature_max: 0.20
  learnable_temperature: false
  queue_size: 4096
  projection_dim: 256
  projection_layers: 2
  projection_activation: "relu"
  use_target_encoder: true
  target_ema_decay: 0.9995           # INCREASED from 0.996 - slower drift
  predictor_depth: 6
  predictor_hidden_dim: 512

# ADDED BACK mild SIGReg to regularize embedding scale
sigreg:
  weight: 0.01                       # Mild regularization (not 0.0)
  num_slices: 1024
  num_points: 17

logging:
  enabled: true
  log_dir: artifacts/jepa/ijepa_v9/tensorboard
  flush_secs: 10
  run_name: jepa_ijepa_v9

diagnostics:
  embedding_metrics:
    enabled: true
    interval: 50
    max_samples: 4096
